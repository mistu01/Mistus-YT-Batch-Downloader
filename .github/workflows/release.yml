name: Build Installer & Release

# Builds the Windows installer and attaches it to a GitHub Release.
# - "Auto release": push a version tag (e.g. `git tag v2.1.0 && git push --tags`)
#   -> builds, creates a GitHub Release and uploads
#      dist/Mistus Batch YT Downloader-<VERSION>-setup.exe
# - "Manual build": Actions tab -> Build Installer & Release -> Run workflow
#   (produces a downloadable artifact only, no release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path build_installer.py -Pattern '^\s*VERSION\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          Write-Output "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "App version: $v"

      - name: Guard - tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -ne "${{ steps.ver.outputs.version }}") {
            Write-Error ("Tag v$tag does not match VERSION = " + "${{ steps.ver.outputs.version }}" + `
              " — bump the version in yt_batch_downloader_mistu.py, build_installer.py, " + `
              "YT-Batch-Downloader-Mistu.iss and README.md, then re-tag.")
            exit 1
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: python build_installer.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mistus-Batch-YT-Downloader-${{ steps.ver.outputs.version }}-setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
